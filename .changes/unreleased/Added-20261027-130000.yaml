kind: Added
body: Neem in `run.json` een dependency-overzicht op per projectbestand (package manager, directe en transitieve dependencies) en rapporteer onder `rules` per regel uit een optioneel `rules.yml` of die geslaagd is; een optioneel `config.yml` gaat als ORT-configuratie mee naar elke ORT-stap, bijvoorbeeld voor de Java-versie van de Gradle-analyse.
