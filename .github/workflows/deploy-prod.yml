name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ort-runner-deploy-production
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ github.event.repository.name }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  INFRA_REPO: ${{ vars.INFRA_REPO }}
  KUSTOMIZE_PATH: ${{ vars.KUSTOMIZE_PATH }}
  DEPLOY_ENV: prod

jobs:
  build-and-push:
    name: Build and push production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          build-args: |
            RUNNER_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  create-infra-pr:
    name: Create production deployment PR
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Validate infra configuration
        id: infra-repo
        env:
          CONFIGURED_INFRA_REPO: ${{ env.INFRA_REPO }}
        run: |
          set -euo pipefail

          if [[ -z "$CONFIGURED_INFRA_REPO" || "$CONFIGURED_INFRA_REPO" != */* ]]; then
            echo "INFRA_REPO moet de vorm owner/repo hebben." >&2
            exit 1
          fi
          if [[ -z "${KUSTOMIZE_PATH:-}" ]]; then
            echo "KUSTOMIZE_PATH is niet ingesteld." >&2
            exit 1
          fi

          echo "owner=${CONFIGURED_INFRA_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${CONFIGURED_INFRA_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Generate release process app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.RELEASE_PROCES_APP_ID }}
          private-key: ${{ secrets.RELEASE_PROCES_APP_PRIVATE_KEY }}
          owner: ${{ steps.infra-repo.outputs.owner }}
          repositories: ${{ steps.infra-repo.outputs.repo }}

      - name: Check out infra repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Create or update release branch
        id: branch
        run: |
          set -euo pipefail

          BRANCH="release/${SOURCE_REPO}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH"

      - name: Update production image tag
        run: |
          set -euo pipefail

          KUSTOMIZATION_FILE="${KUSTOMIZE_PATH%/}/${DEPLOY_ENV}/kustomization.yaml"
          if [[ ! -f "$KUSTOMIZATION_FILE" ]]; then
            echo "Kustomization niet gevonden: $KUSTOMIZATION_FILE" >&2
            exit 1
          fi
          if ! yq e '.images[] | select(.newName == strenv(IMAGE_NAME)) | .newName' "$KUSTOMIZATION_FILE" | grep -Fxq "$IMAGE_NAME"; then
            echo "Image $IMAGE_NAME staat niet in $KUSTOMIZATION_FILE." >&2
            exit 1
          fi

          yq e '(.images[] | select(.newName == strenv(IMAGE_NAME))).newTag = strenv(GITHUB_SHA)' \
            -i "$KUSTOMIZATION_FILE"

      - name: Commit and push release branch
        id: commit
        run: |
          set -euo pipefail

          KUSTOMIZATION_FILE="${KUSTOMIZE_PATH%/}/${DEPLOY_ENV}/kustomization.yaml"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add "$KUSTOMIZATION_FILE"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "release: ${SOURCE_REPO} → ${{ github.sha }}

          Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git push origin "${{ steps.branch.outputs.branch }}" --force
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update infra PR
        id: pull-request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          TITLE="Release: ${SOURCE_REPO} → ${GITHUB_SHA::7}"
          BODY=$(cat <<EOF
          ## ${SOURCE_REPO} productie deploy

          **Image:** \`${IMAGE_NAME}:${GITHUB_SHA}\`
          **Branch:** \`${GITHUB_REF_NAME}\`
          **Commit:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}

          Merge deze PR om de nieuwe versie naar productie te deployen.
          EOF
          )

          PR_NUMBER="$(gh pr list \
            --repo "$INFRA_REPO" \
            --state open \
            --head "${{ steps.branch.outputs.branch }}" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$INFRA_REPO" --title "$TITLE" --body "$BODY"
          else
            PR_URL="$(gh pr create \
              --repo "$INFRA_REPO" \
              --base main \
              --head "${{ steps.branch.outputs.branch }}" \
              --title "$TITLE" \
              --body "$BODY")"
            PR_NUMBER="${PR_URL##*/}"
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
